<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="15%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#FFC820"/>
      <stop offset="60%" stop-color="#D49A12"/>
      <stop offset="85%" stop-color="#9E6E06"/>
      <stop offset="100%" stop-color="#5E3E00"/>
    </linearGradient>

    <linearGradient id="goldRev" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5E3E00"/>
      <stop offset="30%" stop-color="#9E6E06"/>
      <stop offset="60%" stop-color="#D49A12"/>
      <stop offset="85%" stop-color="#FFDF60"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="obsidianBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E1E28"/>
      <stop offset="55%" stop-color="#0F0F16"/>
      <stop offset="100%" stop-color="#06060A"/>
    </radialGradient>

    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFD700" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#obsidianBg)"/>
  
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#gold24k)" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="215" fill="url(#sunGlow)"/>

  <g filter="url(#royalShadow)">
    <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold24k)" stroke-width="14"/>
    <circle cx="256" cy="256" r="187" fill="none" stroke="url(#goldRev)" stroke-width="3" stroke-opacity="0.8"/>
    <circle cx="256" cy="256" r="176" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="3, 10" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="168" fill="url(#obsidianBg)"/>
    <circle cx="256" cy="256" r="168" fill="url(#sunGlow)" opacity="0.6"/>
  </g>

  <!-- Imperial Crown -->
  <g id="crown" transform="translate(256, 155) scale(1.15)">
    <path d="M-62,0 C-20,6 20,6 62,0 L56,12 C20,18 -20,18 -56,12 Z" fill="url(#gold24k)" stroke="#5E3E00" stroke-width="1.2"/>
    <circle cx="-40" cy="7" r="2.5" fill="url(#rubyGrad)"/>
    <circle cx="-20" cy="8.5" r="3" fill="#60A5FA"/>
    <circle cx="0" cy="9" r="3.5" fill="url(#rubyGrad)"/>
    <circle cx="20" cy="8.5" r="3" fill="#60A5FA"/>
    <circle cx="40" cy="7" r="2.5" fill="url(#rubyGrad)"/>

    <path d="M-58,0 L-48,-36 L-30,-12 L0,-52 L30,-12 L48,-36 L58,0 C20,8 -20,8 -58,0 Z" fill="url(#gold24k)" stroke="url(#goldRev)" stroke-width="1.5" filter="url(#goldGlow)"/>
    
    <circle cx="-48" cy="-37" r="4.5" fill="url(#goldRev)"/>
    <circle cx="48" cy="-37" r="4.5" fill="url(#goldRev)"/>
    <circle cx="-30" cy="-12" r="3" fill="url(#rubyGrad)"/>
    <circle cx="30" cy="-12" r="3" fill="url(#rubyGrad)"/>
    
    <path d="M-3,-57 H3 V-50 H-3 Z M-7,-54 H7 V-52 H-7 Z" fill="url(#goldRev)"/>
    <circle cx="0" cy="-44" r="5" fill="url(#rubyGrad)" stroke="url(#gold24k)" stroke-width="1.5"/>
  </g>

  <!-- Luxury Monogram "GM" -->
  <g id="monogram" transform="translate(256, 285)" filter="url(#goldGlow)">
    <text x="-3" y="5" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="900" font-size="124" fill="#2E1D01" letter-spacing="-3">GM</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="900" font-size="124" fill="url(#gold24k)" stroke="url(#goldRev)" stroke-width="2" letter-spacing="-3">GM</text>
  </g>

  <!-- Diamond Stars -->
  <g transform="translate(132, 256) scale(0.7)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#gold24k)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
  <g transform="translate(380, 256) scale(0.7)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#gold24k)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Banner: GOLDEN MATKA -->
  <g transform="translate(256, 385)">
    <rect x="-142" y="-22" width="284" height="42" rx="21" fill="url(#gold24k)" stroke="#5E3E00" stroke-width="2" filter="url(#royalShadow)"/>
    <rect x="-138" y="-18" width="276" height="34" rx="17" fill="#0E0F16" stroke="url(#gold24k)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="19" fill="url(#gold24k)" letter-spacing="3.5">GOLDEN MATKA</text>
  </g>
</svg>